<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Saraban สสอ.กู่แก้ว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ถ้าโหลดฟอนต์จาก CDN ไม่ได้ จะใช้ฟอนต์ไทยของระบบแทนอัตโนมัติ */
:root{
  --primary:#1565e0;--primary-d:#0b3d91;--primary-l:#e8f1ff;--accent:#3d8bfd;
  --ok:#1e8e3e;--ok-l:#e6f4ea;--warn:#e37400;--warn-l:#fef3e2;--bad:#d93025;--bad-l:#fce8e6;
  --text:#1f2937;--muted:#6b7280;--bg:#f4f6fb;--card:#fff;--line:#e3e8f0;
  --radius:12px;--shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Tahoma',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit}
a{color:var(--primary)}
.hidden{display:none!important}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:linear-gradient(180deg,var(--primary-d),#0f4fb8);color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{display:block;font-size:20px;letter-spacing:.3px}
.brand small{opacity:.8;font-size:12.5px}
.nav{padding:10px 8px;overflow-y:auto;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#dbe7ff;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-size:15px}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button.active{background:#fff;color:var(--primary-d);font-weight:600}
.nav .sec{font-size:11.5px;opacity:.6;padding:12px 12px 4px;text-transform:uppercase;letter-spacing:.5px}
.nav .ico{width:20px;text-align:center}
.sidebar-foot{padding:12px 16px;font-size:12px;opacity:.7}
.main{flex:1;margin-left:248px;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;background:none;border:0;font-size:22px;cursor:pointer;color:var(--primary-d)}
.bell{position:relative;background:var(--primary-l);border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px}
.bell .dot{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 5px;min-width:18px}
.user-chip{display:flex;align-items:center;gap:8px;font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700}
.content{padding:22px;max-width:1400px;width:100%}
.backdrop{display:none}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.stat{display:flex;gap:12px;align-items:center;cursor:default}
.stat .si{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--primary-l);flex-shrink:0}
.stat .sv{font-size:26px;font-weight:700;line-height:1.1}
.stat .sl{color:var(--muted);font-size:13.5px}
.stat.ok .si{background:var(--ok-l)}.stat.warn .si{background:var(--warn-l)}.stat.bad .si{background:var(--bad-l)}
.stat.bad .sv{color:var(--bad)}.stat.warn .sv{color:var(--warn)}
.two{grid-template-columns:2fr 1fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;background:var(--primary);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--primary-d);border-color:var(--line)}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn.ghost{background:none;color:var(--primary);padding:4px 8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:14px}
.toolbar .grow{flex:1}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13.5px;font-weight:600;color:#374151}
.field label .req{color:var(--bad)}
.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #cfd7e3;border-radius:8px;padding:8px 10px;background:#fff;color:var(--text);width:100%}
.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus{outline:2px solid #bcd5ff;border-color:var(--primary)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--bad);background:#fffafa}
.field .msg{color:var(--bad);font-size:12.5px;min-height:0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#f7f9fd;font-weight:600;color:#374151;white-space:nowrap}
tbody tr:hover{background:#f9fbff}
tbody tr:last-child td{border-bottom:0}
td.subj{min-width:220px}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12.5px;font-weight:600;background:#eef2f7;color:#374151;white-space:nowrap}
.b-blue{background:var(--primary-l);color:var(--primary-d)}.b-ok{background:var(--ok-l);color:var(--ok)}
.b-warn{background:var(--warn-l);color:var(--warn)}.b-bad{background:var(--bad-l);color:var(--bad)}.b-gray{background:#eef0f3;color:#6b7280}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.pager .pg{display:flex;gap:4px}
.empty{text-align:center;padding:38px 10px;color:var(--muted)}
.empty .e-ico{font-size:34px}
.error-state{background:var(--bad-l);color:var(--bad);border-radius:10px;padding:14px;margin-bottom:12px}
.notice{background:var(--warn-l);color:#8a4b00;border:1px solid #f6d7a7;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.info{background:var(--primary-l);color:var(--primary-d);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.timeline{list-style:none;padding:0;margin:0;font-size:13.5px}
.timeline li{padding:6px 0 6px 14px;border-left:2px solid var(--line);position:relative}
.timeline li:before{content:'';position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.progress{height:8px;background:#e9eef6;border-radius:6px;overflow:hidden;min-width:80px}
.progress span{display:block;height:100%;background:var(--primary)}
.chart{width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:14px}
.list-plain li:last-child{border:0}
.check-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.check-list label{display:flex;gap:8px;padding:4px 0;font-weight:400}

/* ---------- Modal / Toast / Loading ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:80;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.sm{max-width:430px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:17px}
.modal-x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.modal-b{padding:18px 20px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:calc(100% - 32px)}
.toast{background:#1f2937;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14.5px;border-left:5px solid var(--accent);animation:tin .2s}
.toast.ok{border-color:#34c759}.toast.bad{border-color:#ff6b5e}.toast.warn{border-color:#ffb020}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:90;font-weight:600;color:var(--primary-d)}
.spin{width:42px;height:42px;border:4px solid var(--primary-l);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:64px}
.pw-wrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--primary);cursor:pointer;font-size:13px}
.login-hero{text-align:center;margin-bottom:10px}
.login-hero .logo{width:56px;height:56px;border-radius:14px;background:var(--primary);color:#fff;display:inline-grid;place-items:center;font-size:26px}
.guest-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.guest-banner h2{margin:0 0 4px;font-size:19px}
.guest-banner .btn{background:#fff;color:var(--primary-d)}

/* ---------- Responsive ---------- */
@media (max-width:960px){
  .two{grid-template-columns:1fr}
}
@media (max-width:820px){
  .sidebar{transform:translateX(-100%)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .main{margin-left:0}
  .menu-btn{display:block}
  .user-chip .uname{display:none}
  .content{padding:14px}
  .form-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .kv dt{font-weight:600;color:var(--text)}
  .topbar{padding:0 12px}
}
@media print{
  .sidebar,.topbar,.toolbar,.pager,.no-print,.toasts{display:none!important}
  .main{margin:0}.content{padding:0}
  .table-wrap{border:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><b>📨 E-Saraban</b><small>ระบบสารบรรณอิเล็กทรอนิกส์<br>สสอ.กู่แก้ว จ.อุดรธานี</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">เวอร์ชัน 1.0.0</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="เปิดเมนู">☰</button>
      <h1 id="pageTitle">แดชบอร์ด</h1>
      <div class="user-chip hidden" id="userChip">
        <div class="avatar" id="userAvatar">?</div>
        <div class="uname"><div id="userName"></div><small class="muted" id="userRole" style="color:var(--muted)"></small></div>
        <button class="btn sec sm" id="logoutBtn">ออกจากระบบ</button>
      </div>
      <button class="btn" id="loginBtn">เข้าสู่ระบบ</button>
    </header>
    <main class="content" id="content" aria-live="polite"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>
<div class="loading hidden" id="loading"><div class="spin"></div><div id="loadingText">กำลังโหลดข้อมูล...</div></div>

<script>
/* =====================================================================
   CONFIG — แก้ไขจุดเดียว: ใส่ Web App URL (ลงท้าย /exec)
   * ถ้าเปิดหน้านี้ผ่าน Web App URL ของ Apps Script (แนะนำ) ไม่ต้องแก้ค่านี้
     ระบบจะใช้ google.script.run อัตโนมัติ
   * ใช้ค่านี้เฉพาะกรณีเปิด index.html จากโฮสต์ภายนอก (โหมด Standalone)
   ===================================================================== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbz3X0U6D7japqOOVjxhSGQcNUj4UIe3xVM_fx0svMw3tPUw-MXHfhfKqeAivwYdy2U7/exec";

/* ---------- ค่าคงที่ (ต้องตรงกับ Code.gs) ---------- */
const DOC_TYPES = ['บันทึก','หนังสือราชการภายนอก','หนังสือราชการภายใน','ประกาศ','คำสั่ง','ระเบียบ','หนังสือเวียน','รายงาน','อื่นๆ'];
const URGENCY = ['ปกติ','ด่วน','ด่วนมาก','ด่วนที่สุด'];
const SECRET = ['ปกติ','ลับ','ลับมาก','ลับที่สุด'];
const PRIORITY = ['สูง','กลาง','ต่ำ'];
const STATUS_INCOMING = ['รับใหม่','รอสั่งการ/ลงนาม','สั่งการแล้ว'];
const STATUS_OUTGOING = ['ร่าง','รอเสนอ','รอพิจารณา','รอลงนาม','ลงนามแล้ว','ส่งแล้ว','ส่งกลับแก้ไข','ยกเลิก'];
const STATUS_TASK = ['มอบหมายแล้ว','กำลังดำเนินการ','รอผลตรวจสอบ','เสร็จสิ้น','ส่งกลับแก้ไข','ยกเลิก'];
const DIRECTOR_STATUS = ['สั่งการแล้ว','เสร็จสิ้น','รอลงนาม','ลงนามแล้ว','ส่งกลับแก้ไข'];
const ROLE_LABEL = { admin:'ผู้ดูแลระบบ', director:'ผู้บริหาร', officer:'เจ้าหน้าที่', viewer:'ผู้ดูข้อมูล' };
const PAGE_SIZE = 20;

/* =====================================================================
   API LAYER
   - เสิร์ฟผ่าน HtmlService → google.script.run.handleApiCall (ไม่มีปัญหา CORS)
   - เปิดแบบ Standalone → fetch POST ด้วย Content-Type text/plain
     (เป็น simple request จึงไม่มี preflight; GAS จะ redirect ไป googleusercontent
      และเบราว์เซอร์อ่านผลได้ — ต้องทดสอบกับ Deployment จริงก่อนใช้งาน)
   ===================================================================== */
const IS_GAS = (function(){ try { return typeof google !== 'undefined' && google.script && google.script.run; } catch(e){ return false; } })();

function rawCall(payload){
  if (IS_GAS) {
    return new Promise(function(resolve, reject){
      google.script.run
        .withSuccessHandler(function(res){ resolve(res); })
        .withFailureHandler(function(err){ reject(err); })
        .handleApiCall(payload);
    });
  }
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/(exec|dev)$/.test(GAS_URL)) {
    return Promise.reject(new Error('CONFIG'));
  }
  const body = JSON.stringify(payload);
  // a/n ใน URL: ให้เซิร์ฟเวอร์รู้ว่าคำขอใดมาถึงแบบไม่มีข้อมูล (ไว้หาสาเหตุ)
  return fetch(GAS_URL + '?a=' + encodeURIComponent(payload.action) + '&n=' + body.length, {
    method:'POST', redirect:'follow', cache:'no-store',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: body
  }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

/** เรียก API พร้อม loading, จัดการ error กลาง — คืนค่า data เมื่อสำเร็จ หรือ throw */
async function api(action, params, opt){
  opt = opt || {};
  const payload = Object.assign({}, params || {}, { action: action, sessionToken: Store.token() });
  if (opt.loading !== false) UI.loading(true, opt.loadingText || 'กำลังโหลดข้อมูล...');
  try {
    const res = await rawCall(payload);
    if (!res || typeof res !== 'object' || typeof res.ok !== 'boolean') throw new Error('BAD_RESPONSE');
    if (!res.ok) {
      if (res.code === 'SESSION_EXPIRED' || res.code === 'ACCOUNT_INACTIVE') { Auth.clearLocal(); UI.toast(res.message, 'bad'); Auth.openLogin(); Router.go('dashboard'); }
      else if (res.code === 'MUST_CHANGE_PASSWORD') { Auth.openChangePassword(true); }
      const e = new Error(res.message || 'ไม่สามารถดำเนินการได้'); e.code = res.code; e.handled = ['SESSION_EXPIRED','ACCOUNT_INACTIVE','MUST_CHANGE_PASSWORD'].indexOf(res.code) >= 0;
      throw e;
    }
    if (res.message && opt.toast !== false) UI.toast(res.message, 'ok');
    return res.data;
  } catch (err) {
    if (!err.code) {
      const msg = err.message === 'CONFIG' ? 'ยังไม่ได้ตั้งค่า GAS_URL ในไฟล์ index.html' :
                  /not found|setupSheet|Spreadsheet/i.test(err.message || '') ? 'ระบบฐานข้อมูลยังไม่ได้ตั้งค่า' :
                  'ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองอีกครั้ง' + (err.message ? ' (' + String(err.message).slice(0, 200) + ')' : '');
      const e2 = new Error(msg); e2.code = 'NETWORK'; throw e2;
    }
    throw err;
  } finally {
    if (opt.loading !== false) UI.loading(false);
  }
}

/** ใช้กับปุ่ม: ป้องกันกดซ้ำและแสดง error เป็น toast */
async function runAction(btn, fn){
  if (btn) { if (btn.disabled) return; btn.disabled = true; }
  try { return await fn(); }
  catch (e) { if (!e.handled) UI.toast(e.message, 'bad'); }
  finally { if (btn) btn.disabled = false; }
}

/* =====================================================================
   STORE — เก็บ token ใน sessionStorage (ปิดแท็บแล้วหมด) ไม่เก็บข้อมูลเอกสาร
   ===================================================================== */
const Store = {
  user: null,
  token(){ try { return sessionStorage.getItem('es_token') || ''; } catch(e){ return Store._t || ''; } },
  set(token, user){ Store._t = token; Store.user = user; try { sessionStorage.setItem('es_token', token); sessionStorage.setItem('es_user', JSON.stringify(user)); } catch(e){} },
  load(){ try { const u = sessionStorage.getItem('es_user'); Store.user = u ? JSON.parse(u) : null; } catch(e){ Store.user = null; } },
  clear(){ Store._t = ''; Store.user = null; try { sessionStorage.removeItem('es_token'); sessionStorage.removeItem('es_user'); } catch(e){} },
  role(){ return Store.user ? Store.user.role : null; },
  is(){ const r = Store.role(); return Array.prototype.slice.call(arguments).indexOf(r) >= 0; }
};

/* =====================================================================
   DOM HELPERS — สร้าง element ด้วย textContent เสมอ (ป้องกัน XSS)
   ===================================================================== */
function h(tag, attrs){
  const el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.setAttribute('style', v);
    else if (k in el && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  });
  for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, c){
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) { c.forEach(function(x){ append(el, x); }); return; }
  el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
}
function clear(el){ while (el.firstChild) el.removeChild(el.firstChild); return el; }
function $(id){ return document.getElementById(id); }

/** ลิงก์ภายนอก: อนุญาตเฉพาะ https */
function safeLink(url, label){
  const u = String(url || '').trim();
  if (!/^https:\/\//i.test(u)) return h('span', { class:'muted', text: u ? '(ลิงก์ไม่ปลอดภัย)' : '-' });
  return h('a', { href:u, target:'_blank', rel:'noopener noreferrer', text: label || 'เปิดเอกสาร ↗' });
}

/* =====================================================================
   DATE — แสดงผลแบบไทย พ.ศ. เขตเวลา Asia/Bangkok
   ===================================================================== */
const TZ = 'Asia/Bangkok';
function parseDate(v){
  if (!v) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) v = v + 'T00:00:00+07:00';
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(v){ const d = parseDate(v); return d ? d.toLocaleDateString('th-TH', { timeZone:TZ, day:'numeric', month:'short', year:'numeric' }) : '-'; }
function fmtDateTime(v){ const d = parseDate(v); return d ? d.toLocaleString('th-TH', { timeZone:TZ, day:'numeric', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit' }) + ' น.' : '-'; }
/** yyyy-mm-dd ตามเวลาไทย สำหรับใส่ใน input[type=date] */
function isoDay(v){ const d = v ? parseDate(v) : new Date(); if (!d) return ''; return new Intl.DateTimeFormat('en-CA', { timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit' }).format(d); }
function thaiFiscalRange(beYear){ const y = beYear - 543; return { from:(y-1) + '-10-01', to: y + '-09-30' }; }
function currentFiscalBE(){ const t = isoDay(); const y = +t.slice(0,4), m = +t.slice(5,7); return (m >= 10 ? y + 1 : y) + 543; }

/* =====================================================================
   UI: toast / loading / modal / confirm / pager / table / empty
   ===================================================================== */
const UI = {
  _loadCount: 0,
  loading(on, text){
    UI._loadCount = Math.max(0, UI._loadCount + (on ? 1 : -1));
    if (on && text) $('loadingText').textContent = text;
    $('loading').classList.toggle('hidden', UI._loadCount === 0);
  },
  toast(msg, type){
    if (!msg) return;
    const t = h('div', { class:'toast ' + (type || ''), role:'status', text: msg });
    $('toasts').appendChild(t);
    setTimeout(function(){ t.remove(); }, type === 'bad' ? 6000 : 3500);
  },
  /** เปิด modal: คืน { close, body, foot } */
  modal(title, opt){
    opt = opt || {};
    const body = h('div', { class:'modal-b' });
    const foot = h('div', { class:'modal-f' });
    const bg = h('div', { class:'modal-bg', role:'dialog', 'aria-modal':'true' });
    const close = function(){ bg.remove(); document.removeEventListener('keydown', onKey); if (opt.onClose) opt.onClose(); };
    const onKey = function(e){ if (e.key === 'Escape' && !opt.locked) close(); };
    const box = h('div', { class:'modal' + (opt.size === 'sm' ? ' sm' : '') },
      h('div', { class:'modal-h' }, h('h2', { text:title }), opt.locked ? null : h('button', { class:'modal-x', 'aria-label':'ปิด', onclick:close, text:'×' })),
      body, foot);
    bg.appendChild(box);
    // ปิดเมื่อกดและปล่อยบนพื้นหลังจริง ๆ — ไม่นับการลากแถบเลื่อน (ฟอร์มยาว) หรือการลากเลือกข้อความออกนอกกรอบ
    let downOnBg = false;
    if (!opt.locked) {
      bg.addEventListener('mousedown', function(e){ downOnBg = e.target === bg && e.clientX < bg.clientWidth; });
      bg.addEventListener('click', function(e){ if (downOnBg && e.target === bg) close(); downOnBg = false; });
    }
    document.addEventListener('keydown', onKey);
    $('modalRoot').appendChild(bg);
    return { close: close, body: body, foot: foot };
  },
  confirm(title, message, opt){
    opt = opt || {};
    return new Promise(function(resolve){
      let done = false;
      const m = UI.modal(title, { size:'sm', onClose: function(){ if (!done) resolve(null); } });
      m.body.appendChild(h('p', { text: message, style:'margin-top:0' }));
      let reason = null;
      if (opt.reason) {
        reason = h('textarea', { rows:3, maxlength:500, placeholder:'ระบุเหตุผล (จำเป็น)' });
        m.body.appendChild(h('div', { class:'field' }, h('label', { text:'เหตุผล' }), reason));
      }
      m.foot.appendChild(h('button', { class:'btn sec', text:'ยกเลิก', onclick: function(){ m.close(); } }));
      m.foot.appendChild(h('button', { class:'btn ' + (opt.danger ? 'bad' : ''), text: opt.okText || 'ยืนยัน', onclick: function(){
        if (reason && !reason.value.trim()) { UI.toast('กรุณาระบุเหตุผล', 'warn'); reason.focus(); return; }
        done = true; m.close(); resolve(reason ? reason.value.trim() : true);
      }}));

  },
  empty(text){ return h('div', { class:'empty' }, h('div', { class:'e-ico', text:'📭' }), h('div', { text: text || 'ยังไม่มีข้อมูลในระบบ' })); },
  errorBox(msg, retry){ return h('div', { class:'error-state' }, h('b', { text:'เกิดข้อผิดพลาด: ' }), msg, ' ', retry ? h('button', { class:'btn sm sec', text:'ลองใหม่', onclick:retry }) : null); },
  /** columns: [{label, render(row) | key}] */
  table(columns, rows, emptyText){

    return h('div', { class:'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, columns.map(function(c){ return h('th', { text:c.label }); }))),
      h('tbody', null, rows.map(function(r){
        return h('tr', null, columns.map(function(c){

          return h('td', { class: c.cls || null }, v);

  },
  pager(total, page, pageSize, onPage){
    const pages = Math.max(1, Math.ceil(total / pageSize));
    const from = total ? (page - 1) * pageSize + 1 : 0, to = Math.min(total, page * pageSize);

  kv(pairs){ const dl = h('dl', { class:'kv' }); pairs.forEach(function(p){ if (p) { dl.appendChild(h('dt', { text:p[0] })); dl.appendChild(h('dd', null, p[1] === '' || p[1] === undefined || p[1] === null ? '-' : p[1])); } }); return dl; },

/* =====================================================================
   FORM BUILDER + VALIDATION (Backend ตรวจซ้ำเสมอ)
   field: { name, label, type, options, required, max, full, min, placeholder, help }
   ===================================================================== */
function buildForm(fields, values){
  values = values || {};
  const form = h('form', { class:'form-grid', novalidate:true, onsubmit: function(e){ e.preventDefault(); } });
  fields.forEach(function(f){
    let input;
    const v = values[f.name] !== undefined && values[f.name] !== null ? values[f.name] : (f.value !== undefined ? f.value : '');
    if (f.type === 'select') {
      input = h('select', { name:f.name }, f.required ? null : h('option', { value:'', text:'— เลือก —' }),
        (f.options || []).map(function(o){ const val = typeof o === 'object' ? o.value : o, lab = typeof o === 'object' ? o.label : o; return h('option', { value:val, text:lab, selected: String(v) === String(val) }); }));
      if (f.required && !v && f.options && f.options.length) input.value = typeof f.options[0] === 'object' ? f.options[0].value : f.options[0];
    } else if (f.type === 'textarea') {
      input = h('textarea', { name:f.name, rows:f.rows || 3, maxlength:f.max || 2000, placeholder:f.placeholder || '' });
      input.value = v;
    } else if (f.type === 'password') {
      input = h('input', { name:f.name, type:'password', maxlength:f.max || 128, autocomplete: f.autocomplete || 'new-password' });
      const wrap = h('div', { class:'pw-wrap' }, input, h('button', { type:'button', text:'แสดง', onclick: function(e){ const show = input.type === 'password'; input.type = show ? 'text' : 'password'; e.target.textContent = show ? 'ซ่อน' : 'แสดง'; } }));
      input._wrap = wrap;
    } else {
      input = h('input', { name:f.name, type: f.type === 'url' ? 'url' : (f.type || 'text'), maxlength:f.max || 300, placeholder:f.placeholder || '', min:f.min, max: f.type === 'number' ? f.maxNum : null });
      input.value = f.type === 'date' ? (v ? isoDay(v) : '') : v;
    }
    if (f.readonly) input.disabled = true;
    const box = h('div', { class:'field' + (f.full ? ' full' : '') },
      h('label', null, f.label, f.required ? h('span', { class:'req', text:' *' }) : null),
      input._wrap || input,
      f.help ? h('small', { style:'color:var(--muted)', text:f.help }) : null,
      h('div', { class:'msg' }));
    box.dataset.name = f.name;
    form.appendChild(box);
  });
  form._fields = fields;
  return form;
}

/** ตรวจฟอร์ม: คืน values หรือ null พร้อมแสดงข้อความใกล้ช่อง */
function readForm(form){
  const values = {}; let ok = true, first = null;
  form._fields.forEach(function(f){
    if (f.readonly) return;
    const box = form.querySelector('[data-name="' + f.name + '"]');
    const el = form.elements[f.name];
    let v = (el.value || '').trim();
    let err = '';
    if (f.required && !v) err = 'กรุณากรอก' + f.label;
    else if (v && f.max && v.length > f.max) err = 'ความยาวต้องไม่เกิน ' + f.max + ' ตัวอักษร';
    else if (v && f.type === 'date' && (!/^\d{4}-\d{2}-\d{2}$/.test(v) || !parseDate(v))) err = 'รูปแบบวันที่ไม่ถูกต้อง';
    else if (v && f.type === 'url' && !/^https:\/\/[^\s]+$/i.test(v)) err = 'ลิงก์ต้องขึ้นต้นด้วย https://';
    else if (v && f.type === 'select' && f.options && !f.options.some(function(o){ return String(typeof o === 'object' ? o.value : o) === v; })) err = 'ค่าที่เลือกไม่ถูกต้อง';
    else if (v && f.type === 'number' && (isNaN(+v) || (f.min !== undefined && +v < f.min) || (f.maxNum !== undefined && +v > f.maxNum))) err = 'ตัวเลขไม่ถูกต้อง';
    else if (v && f.pattern && !f.pattern.test(v)) err = f.patternMsg || 'รูปแบบไม่ถูกต้อง';
    if (!err && f.validate) err = f.validate(v, form) || '';
    box.classList.toggle('invalid', !!err);
    box.querySelector('.msg').textContent = err;
    if (err) { ok = false; if (!first) first = el; }
    values[f.name] = f.type === 'number' && v !== '' ? +v : v;
  });
  if (!ok) { first.focus(); UI.toast('พบข้อมูลไม่ครบถ้วน กรุณาตรวจสอบช่องที่มีเครื่องหมายสีแดง', 'warn'); return null; }
  return values;
}

/** แสดงฟอร์มใน modal; onSave(values) คืน Promise */
function formModal(title, fields, values, onSave, saveText){
  const m = UI.modal(title);
  const form = buildForm(fields, values);
  m.body.appendChild(form);
  const saveBtn = h('button', { class:'btn', text: saveText || 'บันทึก' });
  saveBtn.addEventListener('click', function(){
    const v = readForm(form); if (!v) return;
    runAction(saveBtn, async function(){ await onSave(v); m.close(); });
  });
  m.foot.appendChild(h('button', { class:'btn sec', text:'ยกเลิก', onclick: function(){ m.close(); } }));
  m.foot.appendChild(saveBtn);
  return m;
}

/** ส่งออก CSV (UTF-8 BOM เปิดใน Excel ได้) — ป้องกัน formula injection */
function downloadCSV(filename, headers, rows){
  const cell = function(v){ let s = v === null || v === undefined ? '' : String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const csv = '﻿' + [headers.map(function(x){ return cell(x[1]); }).join(',')].concat(rows.map(function(r){ return headers.map(function(x){ return cell(r[x[0]]); }).join(','); })).join('\r\n');
  const a = h('a', { href: URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' })), download: filename });
  document.body.appendChild(a); a.click(); a.remove();
}

/** อัปโหลดไฟล์ (base64) — ไฟล์ใหญ่แบ่งส่งทีละท่อน เพราะคำขอที่ใหญ่เกินไปจะไปถึงเซิร์ฟเวอร์เป็นค่าว่าง */
const UPLOAD_CHUNK = 100000;
/** ส่งข้อมูล base64 ที่ใหญ่เกิน UPLOAD_CHUNK เป็นท่อน ๆ (files.chunk) — คืนพารามิเตอร์ที่ใช้แทน data; ข้อมูลเล็กคืน { data } เดิม */
async function sendData(data, onProgress){
  if (data.length <= UPLOAD_CHUNK) return { data:data };
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 10), n = Math.ceil(data.length / UPLOAD_CHUNK);
  // ส่งพร้อมกันทีละ 4 ก้อน (เร็วกว่าส่งทีละก้อน) — เซิร์ฟเวอร์เก็บแยกตามลำดับก้อน จึงต่อกลับได้ถูกต้อง
  let next = 0, done = 0;
  const worker = async function(){
    while (next < n) {
      const i = next++;
      await api('files.chunk', { uploadId:id, index:i, data:data.slice(i * UPLOAD_CHUNK, (i + 1) * UPLOAD_CHUNK) }, { loading:false, toast:false });
      done++; if (onProgress) onProgress(Math.round(done * 100 / n));
    }
  };
  await Promise.all([0, 1, 2, 3].slice(0, n).map(worker));
  return { data:'', uploadId:id, chunks:n };
}
async function uploadFile(p, opt){
  const show = opt.loading !== false;
  if (show) UI.loading(true, opt.loadingText || 'กำลังอัปโหลดไฟล์...');
  try {
    const part = await sendData(p.data, show ? function(pc){ $('loadingText').textContent = 'กำลังอัปโหลดไฟล์... ' + pc + '%'; } : null);
    return await api('files.upload', Object.assign({}, p, part), Object.assign({}, opt, { loading:false }));
  } finally { if (show) UI.loading(false); }
}

/** ปุ่มเลือกไฟล์: อัปโหลดไป Google Drive แล้วใส่ลิงก์ในช่อง URL ให้อัตโนมัติ */
const UPLOAD_MAX = 10 * 1024 * 1024;
function attachUploader(form, fieldName, onDone, onStart){
  const box = form.querySelector('[data-name="' + fieldName + '"]');
  const urlInput = form.elements[fieldName];
  const file = h('input', { type:'file', accept:'.pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx' });
  const status = h('small', { style:'color:var(--muted)' });
  file.addEventListener('change', function(){
    const f = file.files[0]; if (!f) return;
    if (f.size > UPLOAD_MAX) { UI.toast('ขนาดไฟล์ต้องไม่เกิน 10 MB', 'warn'); file.value = ''; return; }
    const rd = new FileReader();
    rd.onerror = function(){ UI.toast('อ่านไฟล์ไม่สำเร็จ', 'bad'); };
    rd.onload = function(){
      const b64 = String(rd.result).split(',')[1] || '';
      // จำงานอัปโหลดที่ค้างไว้ในฟอร์ม — กดบันทึกก่อนอัปโหลดเสร็จจะรอจนได้ลิงก์ไฟล์ (กันไฟล์แนบหาย)
      form._uploading = runAction(file, async function(){
        status.textContent = 'กำลังอัปโหลด...';
        try {
          const pre = onStart ? onStart(f, b64) : null; // เริ่มอ่านไฟล์พร้อมกับอัปโหลด
          if (pre) pre.catch(function(){});
          const d = await uploadFile({ fileName:f.name, mimeType:f.type, data:b64 }, { loadingText:'กำลังอัปโหลดไฟล์...' });
          urlInput.value = d.url;
          status.textContent = '✓ อัปโหลดแล้ว: ' + d.name;
          if (onDone) { try { await onDone(d, f, pre); } catch (ex) { if (!ex.handled) UI.toast(ex.message, 'warn'); } }
        } catch (e) { status.textContent = ''; file.value = ''; throw e; }
      });
    };
    rd.readAsDataURL(f);
  });
  box.insertBefore(h('div', { style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, file, status), box.querySelector('.msg'));
}

const Auth = {

  async localSummary(f){

    }

      console.warn('publicStats:', e.message);

  /** กราฟแท่ง SVG — ไม่พึ่ง CDN */
  chart(data){
    if (!data.length || !data.some(function(m){ return m.incoming || m.outgoing; })) return UI.empty('ยังไม่มีข้อมูลในระบบ');
    const NS = 'http://www.w3.org/2000/svg', W = 600, H = 240, pad = 30, bw = 16;
    const max = Math.max.apply(null, data.map(function(m){ return Math.max(m.incoming, m.outgoing); }).concat([1]));
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'chart'); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'กราฟหนังสือรับและส่งรายเดือน');
    const mk = function(tag, a, txt){ const e = document.createElementNS(NS, tag); Object.keys(a).forEach(function(k){ e.setAttribute(k, a[k]); }); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; };
    mk('line', { x1:pad, y1:H - pad, x2:W - 10, y2:H - pad, stroke:'#cfd7e3' });
    const step = (W - pad - 10) / data.length;
    const thaiM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    data.forEach(function(m, i){
      const x = pad + i * step + step / 2;
      [['incoming', '#1565e0', -bw - 2], ['outgoing', '#7fb2ff', 2]].forEach(function(s){
        const v = m[s[0]] || 0, bh = (H - pad * 2) * v / max;
        const r = mk('rect', { x: x + s[2], y: H - pad - bh, width: bw, height: Math.max(bh, 0), rx:3, fill:s[1] });
        const t = document.createElementNS(NS, 'title'); t.textContent = (s[0] === 'incoming' ? 'รับ ' : 'ส่ง ') + v; r.appendChild(t);
        if (v) mk('text', { x: x + s[2] + bw / 2, y: H - pad - bh - 4, 'text-anchor':'middle', 'font-size':11, fill:'#374151' }, String(v));
      });
      const parts = String(m.label).split('/');

  /** ภาพเกษียณหนังสือ: ข้อสั่งการ + ลายเซ็น + ชื่อ + วันที่ (วาดบน canvas เพื่อให้ภาษาไทยถูกต้องโดยไม่ต้องฝังฟอนต์ใน PDF) */
  stamp(sig, note){
    const S = 2, W = 300 * S, pad = 8 * S, fs = 18 * S, lh = fs * 1.3, font = fs + 'px Sarabun, Tahoma, sans-serif';
    const c = document.createElement('canvas'), x = c.getContext('2d');

    const bottom = ['(' + (u.fullName || u.username) + ')'].concat(u.department ? [u.department] : []).concat([fmtDate(isoDay())]);
    const sh = 60 * S, sw = Math.min(W - pad * 2, sh * sig.width / sig.height);

   *  ใช้ pdf.js วาดหน้าลง canvas แล้วหาช่องที่ไม่มีจุดสีเข้ม เลือกตำแหน่งต่ำสุด/ขวาสุดก่อน (ตำแหน่งเกษียณหนังสือปกติ) */
  async findBlank(bytes, w, h){

    const page = await doc.getPage(1), vp = page.getViewport({ scale:1 });
    const W = Math.ceil(vp.width), H = Math.ceil(vp.height);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    await page.render({ canvasContext:ctx, viewport:vp }).promise;
    const px = ctx.getImageData(0, 0, W, H).data;
    // ตารางผลรวมสะสมของจุดสีเข้ม — นับจุดเข้มในสี่เหลี่ยมใด ๆ ได้ทันที
    const S = new Int32Array((W + 1) * (H + 1));
    for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { const i = (y * W + x) * 4; if (px[i] + px[i+1] + px[i+2] < 600) row++; S[(y + 1) * (W + 1) + x + 1] = S[y * (W + 1) + x + 1] + row; } }
    const dark = function(x, y, ww, hh){ return S[(y + hh) * (W + 1) + x + ww] - S[y * (W + 1) + x + ww] - S[(y + hh) * (W + 1) + x] + S[y * (W + 1) + x]; };
    const pad = 6, mg = 20;
    for (let k = 0; k < 4; k++) { // ไม่พอ → ย่อลายเซ็นลงทีละ 15%
      const ww = Math.round(w) + pad * 2, hh = Math.round(h) + pad * 2;
      for (let y = H - mg - hh; y >= mg; y -= 6) {
        for (let x = W - mg - ww; x >= mg; x -= 6) {
          if (dark(x, y, ww, hh) <= 3) return { x:x + pad, y:H - y - hh + pad, w:w, h:h };
        }
      }
      w *= 0.85; h *= 0.85;
    }

  },
  /** ประทับลายเซ็นลงหน้าแรกของ PDF แล้วอัปโหลดเป็นไฟล์ใหม่ (ไฟล์เดิมยังอยู่) — คืนลิงก์ไฟล์ที่ลงนามแล้ว */
  async signPdf(fileId, sigCanvas, note, pos){
    UI.loading(true, 'กำลังลงนามในไฟล์ PDF...');
    try {
      await Sign.loadLib();
      const f = await api('files.get', { fileId:fileId }, { loading:false, toast:false });
      let bytes = Uint8Array.from(atob(f.data), function(ch){ return ch.charCodeAt(0); });
      let doc;
      if (/^image\//.test(f.mime || '')) {

        doc = await PDFLib.PDFDocument.create();
        const img = f.mime === 'image/png' ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
        const A4 = [595.28, 841.89], sc = Math.min(A4[0] / img.width, A4[1] / img.height);
        const pg = doc.addPage(A4);
        pg.drawImage(img, { x:(A4[0] - img.width * sc) / 2, y:(A4[1] - img.height * sc) / 2, width:img.width * sc, height:img.height * sc });
        bytes = await doc.save();
      } else doc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption:true });

      const png = await doc.embedPng(st.toDataURL('image/png'));

      let w = 200, hh = w * st.height / st.width; // กว้างขึ้นรับตัวอักษรขนาด 18
      const mg = 36;
      let xy = { br:[ps.width - w - mg, mg], bl:[mg, mg], tr:[ps.width - w - mg, ps.height - hh - mg - 90] }[pos];
      if (!xy) { // อัตโนมัติ: หาพื้นที่ว่างบนหน้าแรก ไม่ทับตัวหนังสือ
        const b = await Sign.findBlank(bytes, w, hh).catch(function(){ return null; });
        if (b) { xy = [b.x, b.y]; w = b.w; hh = b.h; }
        else { xy = [ps.width - w - mg, mg]; UI.toast('ไม่พบพื้นที่ว่างพอ — วางลายเซ็นที่มุมล่างขวา', 'warn'); }
      }
      page.drawImage(png, { x:xy[0], y:xy[1], width:w, height:hh });
      const b64 = await doc.saveAsBase64();
      const name = 'ลงนาม_' + String(f.name).replace(/^\d{8}-\d{6}_/, '').replace(/\.(pdf|jpe?g|png)$/i, '') + '.pdf';
      const up = await uploadFile({ fileName:name, mimeType:'application/pdf', data:b64, srcId:f.srcId }, { loading:false, toast:false });
      return { url:up.url, oldId:f.oldSignedId || '' };
    } finally { UI.loading(false); }
  }

  firstPage(f, b64){

      const img = new Image();

        const s = Math.min(1, 1600 / Math.max(img.width, img.height));

function deadlineCell(deadline, status){
  if (!deadline) return '-';
  const done = ['เสร็จสิ้น','ยกเลิก','ส่งแล้ว'].indexOf(status) >= 0;
  const today = isoDay(), dl = isoDay(deadline);
  const days = Math.round((parseDate(dl) - parseDate(today)) / 86400000);
  const label = fmtDate(deadline);
  if (done) return label;
  if (days < 0) return h('span', null, label, ' ', h('span', { class:'badge b-bad', text:'เกิน ' + (-days) + ' วัน' }));
  if (days <= 3) return h('span', null, label, ' ', h('span', { class:'badge b-warn', text: days === 0 ? 'วันนี้' : 'อีก ' + days + ' วัน' }));
  return label;
}

/* ---------- Workflow: ปุ่มเปลี่ยนสถานะตามขั้นตอน ---------- */
const Workflow = {
  buttons(m, module, rec, flow, onDone){
    if (!Store.is('admin','director','officer')) return;
    const isBoss = Store.is('admin','director');
    let next = flow[rec.status] || [];
    if (Store.is('admin')) next = (module === 'incoming' ? STATUS_INCOMING : STATUS_OUTGOING).filter(function(x){ return x !== rec.status && x !== 'ยกเลิก'; });
    next = next.filter(function(s){ return isBoss || DIRECTOR_STATUS.indexOf(s) < 0; });
    // ผู้บริหาร (director) ในทะเบียนหนังสือส่ง: เลือกได้เฉพาะ ลงนามแล้ว / ส่งกลับแก้ไข
    if (module === 'outgoing' && Store.is('director')) next = ['ส่งแล้ว','ยกเลิก'].indexOf(rec.status) >= 0 ? [] : ['ลงนามแล้ว','ส่งกลับแก้ไข'].filter(function(s){ return s !== rec.status; });
    if (!next.length) return;
    const sel = h('select', null, next.map(function(s){ return h('option', { value:s, text:s }); }));
    const btn = h('button', { class:'btn ok', text:'เปลี่ยนสถานะ' });
    btn.addEventListener('click', function(){ Workflow.change(module, rec, sel.value, onDone); });
    m.foot.insertBefore(h('div', { style:'display:flex;gap:6px;margin-right:auto' }, sel, btn), m.foot.firstChild);
  },
  change(module, rec, status, onDone){
    const isDirective = status === 'สั่งการแล้ว';
    const users = _userCache || [];
    const fields = [{ name:'note', label: isDirective ? 'ข้อความสั่งการ' : 'บันทึก/เหตุผล', type:'textarea', required: isDirective || status === 'ส่งกลับแก้ไข', max:1000, full:true }];
    if (isDirective) {
      fields.push({ name:'assignee', label:'ผู้รับผิดชอบ', type:'select', options:userOptions(users), required:true });
    }
    formModal('เปลี่ยนสถานะเป็น "' + status + '"', fields, { assignee: rec.assignedTo }, async function(v){
      const upd = { id:rec.id, status:status, note:v.note };
      if (isDirective) upd.assignedTo = v.assignee;
      await api(module + '.update', upd, { loadingText:'กำลังส่งคำสั่ง...' });
      onDone();
    }, 'ยืนยัน');
  }
};

const OUTGOING_FLOW = {

  'รอลงนาม':['ลงนามแล้ว','ส่งกลับแก้ไข'], 'ลงนามแล้ว':['ส่งแล้ว'], 'ส่งกลับแก้ไข':['ร่าง','รอเสนอ']
};
/** เลขที่หนังสือส่งตามประเภท: คำสั่ง = เลข/ปี พ.ศ., ประกาศ = ไม่มีเลขอัตโนมัติ, อื่น ๆ = รหัสหน่วยงาน + เลข */
function docNo(r, prefix){
  if (!r || !r.sendNo) return '';
  if (r.documentType === 'คำสั่ง') return r.sendNo + '/' + r.sendYear;
  return (prefix || '') + r.sendNo;
}

    // ทะเบียนหนังสือส่งภายใน: ซ่อนช่องที่ไม่ใช้ (อ้างถึง/สิ่งที่ส่งมาด้วย/กลุ่มงาน/ผู้ประสาน/โทร/ลิงก์ไฟล์)
    const INT_DROP = ['refer','enclosure','ownerUnit','coord','tel','attachmentUrl'];
    const isInt = function(t){ return t === 'หนังสือราชการภายใน' || t === 'คำสั่ง' || t === 'ประกาศ'; }; // ภายใน + คำสั่ง + ประกาศ ไม่ใช้ช่องเหล่านี้
    const toggleInt = function(){
      const hide = isInt(form.elements.documentType.value);
      const ord = form.elements.documentType.value === 'คำสั่ง';
      const show = function(k, on){ const el = form.elements[k]; const w = el && (el.closest('.field') || el.parentNode); if (w) w.style.display = on ? '' : 'none'; };
      INT_DROP.forEach(function(k){ show(k, !hide); });
      const ann = form.elements.documentType.value === 'ประกาศ';
      show('p3', !ord && !ann); show('effDate', ord); // คำสั่ง: ภาคสรุป = ทั้งนี้ ตั้งแต่ (วันที่)
      ['no','p2','closing'].forEach(function(k){ show(k, !ann); }); // ประกาศ: ไม่มีเลขที่/ย่อหน้า 2–3/คำลงท้าย
    };
    form.elements.documentType.addEventListener('change', toggleInt);
    toggleInt();
    const pack = function(v){
      Letter.remember(v);
      const ld = Letter.pick(v);
      if (isInt(v.documentType)) INT_DROP.forEach(function(k){ delete ld[k]; });
      if (v.documentType === 'คำสั่ง') delete ld.p3; else delete ld.effDate;
      if (v.documentType === 'ประกาศ') ['no','p2','p3','closing'].forEach(function(k){ delete ld[k]; });
      return Object.assign({ documentType:v.documentType, destinationOrg:v.to, subject:v.subject, documentDate:v.date, letterData:JSON.stringify(ld) },
        isInt(v.documentType) ? {} : { attachmentUrl:v.attachmentUrl });
    };
    const save = function(submit, btn){
      const v = readForm(form); if (!v) return;
      v.no = lv.no;
      runAction(btn, async function(){
        const d = pack(v);
        if (rec) await api('outgoing.update', Object.assign({ id:rec.id }, d, submit ? { status:'รอเสนอ', note:'เสนอพิจารณา' } : {}), { loadingText:'กำลังแก้ไขรายการ...' });
        else await api('outgoing.create', Object.assign({}, d, { status: submit ? 'รอเสนอ' : 'ร่าง' }), { loadingText:'กำลังบันทึกข้อมูล...' });
        m.close(); Router.go('outgoing');
      });
    };
    m.foot.appendChild(h('button', { class:'btn sec', text:'ยกเลิก', onclick: function(){ m.close(); } }));
    m.foot.appendChild(h('button', { class:'btn sec', text:'🖨 พิมพ์', onclick: function(){ const v = readForm(form); if (!v) return; v.no = lv.no; Letter.remember(v); Letter.print({ subject:v.subject, urgency:v.urgency, confidentiality:v.confidentiality, documentType: v.documentType || (rec && rec.documentType) }, v); } }));
    m.foot.appendChild(h('button', { class:'btn sec', text:'💾 บันทึกร่าง', onclick: function(e){ save(false, e.currentTarget); } }));
    m.foot.appendChild(h('button', { class:'btn', text:'📨 บันทึกและเสนอ', onclick: function(e){ save(true, e.currentTarget); } }));
  },

    const m = UI.modal(r.sendNo ? r.documentType + ' ที่ ' + docNo(r, Outgoing.prefix) : r.documentType || 'หนังสือส่ง');

      ['วันที่ส่ง', fmtDate(r.sendDate)], ['ลงวันที่', fmtDate(r.documentDate)], ['ไฟล์', safeLink(r.attachmentUrl)],
      ['หนังสือที่เกี่ยวข้อง', r.relatedDocumentIds], ['บันทึก', h('div', { style:'white-space:pre-wrap', text:r.remarks || '-' })],

      m.foot.appendChild(h('button', { class:'btn sec', text:'✏️ แก้ไข', onclick: function(){ m.close(); Outgoing.openForm(r); } }));
